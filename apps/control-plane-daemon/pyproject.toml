[project]
name = "control-plane-daemon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-memory",
    "agent-infra",
    "litellm",
    "mcp",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-memory = { workspace = true }
agent-infra = { workspace = true }
