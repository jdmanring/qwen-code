[project]
name = "agent-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client",
    "sentence-transformers",
    "anyio",
    "mcp",
    "requests",
    "agent-infra",
    "pytest-asyncio",
]

[tool.uv.sources]
agent-infra = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
