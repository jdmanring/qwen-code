[project]
name = "megacode-monorepo"
version = "0.1.0"
description = "Megalonyx monorepo — upstream sync pipeline, Python SDK, and sovereign tooling"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "packages/acp-bridge",
    "packages/channels/base",
    "packages/channels/dingtalk",
    "packages/channels/plugin-example",
    "packages/channels/telegram",
    "packages/channels/weixin",
    "packages/channels",
    "packages/cli",
    "packages/core",
    "packages/sdk-java",
    "packages/sdk-python",
    "packages/sdk-typescript",
    "packages/vscode-ide-companion",
    "packages/web-templates",
    "packages/webui",
    "packages/zed-extension",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.8.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
