[project]
name = "megalonyx-monorepo"
version = "0.1.0"
description = "Megalonyx monorepo -- upstream sync pipeline, Python SDK, and proprietary extensions"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff.lint]
select = ["E", "F", "N"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
