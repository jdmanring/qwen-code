# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    target-branch: 'develop'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    assignees:
      - 'jdmanring'
    reviewers:
      - 'jdmanring'
    groups:
      # Group runtime and dev updates separately to reduce PR noise.
      # Major updates create separate PRs automatically.
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Ignore packages pinned via pnpm overrides in pnpm-workspace.yaml.
    # These are managed deliberately and must not be auto-bumped by dependabot.
    ignore:
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/coverage-v8'
      - dependency-name: 'vite'
      - dependency-name: 'typescript'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    target-branch: 'develop'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    assignees:
      - 'jdmanring'
    reviewers:
      - 'jdmanring'
