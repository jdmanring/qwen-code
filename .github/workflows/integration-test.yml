name: Integration Tests

on:
  push:
    branches: ['integration', 'develop', 'main', 'release/**']
  pull_request:
    branches: ['integration', 'develop', 'main']

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:6333/ && echo "Qdrant ready" && break
            echo "Waiting for Qdrant... ($i/30)"
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install all workspace packages
        run: uv sync --all-packages

      - name: Boot verification
        run: uv run python3 tooling/smoke-tests/boot_verification.py

      - name: Model router integration test
        run: uv run python3 tooling/smoke-tests/model_router_test.py
